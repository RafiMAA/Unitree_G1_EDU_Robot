# Shared localization and safety components; navigation uses astar_params.yaml.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: nav2_amcl::OmniMotionModel
    min_particles: 500
    max_particles: 2000
    max_beams: 90
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    update_min_d: 0.10
    update_min_a: 0.10
    transform_tolerance: 0.3
    tf_broadcast: true
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 30.0
    feedback: OPEN_LOOP
    scale_velocities: false
    # Limits match the RL policy's trained command ranges. The A* lookahead
    # controller already caps its own output to 0.65 / 1.0, so these
    # wider limits only affect manual teleop.  The state_machine's
    # slew-rate limiter provides the final safety ramp.
    max_velocity: [1.0, 0.5, 1.0]
    min_velocity: [-0.5, -0.5, -1.0]
    # Acceleration ramps supplement the locomotion controller's final ramp.
    max_accel: [1.0, 1.0, 1.5]
    max_decel: [-1.0, -1.0, -1.5]
    odom_topic: /g1/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_collision
    state_topic: /collision_monitor_state
    transform_tolerance: 0.2
    # The synthetic 360-degree cloud renders four cameras and may arrive at
    # close to 2 Hz under load. The filtered cloud is already transformed and
    # freshly stamped in base_footprint, so odometry-based shift correction is
    # unnecessary and was the source of extrapolation errors.
    source_timeout: 1.0
    base_shift_correction: false
    stop_pub_timeout: 1.0
    # Direction-aware collision prediction lets a clear reverse/sideways
    # command escape a wall without a static box blocking every direction.
    polygons: [footprint_approach]
    footprint_approach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.0
      simulation_time_step: 0.05
      max_points: 4
      visualize: true
      polygon_pub_topic: /collision_approach_footprint
      enabled: true
    observation_sources: [mid360]
    mid360:
      type: pointcloud
      topic: /g1/mid360/points_filtered
      min_height: 0.10
      max_height: 2.0
      use_global_height: false
      enabled: true
