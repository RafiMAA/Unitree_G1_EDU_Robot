amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: nav2_amcl::OmniMotionModel
    min_particles: 500
    max_particles: 2000
    max_beams: 90
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    update_min_d: 0.10
    update_min_a: 0.10
    transform_tolerance: 0.3
    tf_broadcast: true
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.25
      use_astar: true
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.35
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.7
      lookahead_dist: 0.8
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.7
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.70
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.38, 0.32], [0.38, -0.32], [-0.28, -0.32], [-0.28, 0.32]]"
      footprint_padding: 0.05
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: mid360
        mid360:
          topic: /g1/mid360/points_filtered
          sensor_frame: base_footprint
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_min_range: 0.35
          obstacle_max_range: 5.0
          raytrace_min_range: 0.35
          raytrace_max_range: 6.0
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          expected_update_rate: 0.20
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.38, 0.32], [0.38, -0.32], [-0.28, -0.32], [-0.28, 0.32]]"
      footprint_padding: 0.05
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 1.0
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.8

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /g1/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 30.0
    feedback: OPEN_LOOP
    scale_velocities: false
    # Limits match the RL policy's trained command ranges.  The MPPI
    # controller already caps its own output to 0.20 / 0.40, so these
    # wider limits only affect manual teleop.  The state_machine's
    # slew-rate limiter provides the final safety ramp.
    max_velocity: [1.0, 0.5, 1.0]
    min_velocity: [-0.5, -0.5, -1.0]
    # Proper acceleration limits (1.0 m/s²) to prevent jerk. The state_machine's
    # 3.0 m/s² slew-rate acts as a safety net, avoiding double-smoothing.
    max_accel: [1.0, 1.0, 1.0]
    max_decel: [-1.0, -1.0, -1.0]
    odom_topic: /g1/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_safe
    state_topic: /collision_monitor_state
    transform_tolerance: 0.2
    # The synthetic 360-degree cloud renders four cameras and may arrive at
    # close to 2 Hz under load. The filtered cloud is already transformed and
    # freshly stamped in base_footprint, so odometry-based shift correction is
    # unnecessary and was the source of extrapolation errors.
    source_timeout: 1.0
    base_shift_correction: false
    stop_pub_timeout: 1.0
    polygons: [slowdown_zone, stop_zone]
    slowdown_zone:
      type: polygon
      points: "[[0.85, 0.55], [0.85, -0.55], [-0.40, -0.55], [-0.40, 0.55]]"
      action_type: slowdown
      min_points: 4
      slowdown_ratio: 0.30
      visualize: true
      polygon_pub_topic: /collision_slowdown_zone
      enabled: true
    stop_zone:
      type: polygon
      points: "[[0.48, 0.38], [0.48, -0.38], [-0.32, -0.38], [-0.32, 0.38]]"
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: /collision_stop_zone
      enabled: true
    observation_sources: [mid360]
    mid360:
      type: pointcloud
      topic: /g1/mid360/points_filtered
      min_height: 0.10
      max_height: 2.0
      use_global_height: false
      enabled: true
