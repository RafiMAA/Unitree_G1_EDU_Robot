amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: nav2_amcl::OmniMotionModel
    min_particles: 500
    max_particles: 2000
    max_beams: 90
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    update_min_d: 0.10
    update_min_a: 0.10
    transform_tolerance: 0.3
    tf_broadcast: true
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.25
      use_astar: true
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    odom_topic: /g1/odom
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 8.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.35
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_mppi_controller::MPPIController
      angular_dist_threshold: 0.15
      angular_disengage_threshold: 0.10
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.60
      max_angular_accel: 0.8
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      # Turn to the path first, then track forward. BackUp is a separate
      # collision-checked recovery action and can still request reverse.
      motion_model: DiffDrive
      time_steps: 30
      model_dt: 0.1
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.20
      vy_std: 0.0
      wz_std: 0.30
      vx_max: 0.35
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.60
      transform_tolerance: 0.2
      prune_distance: 1.5
      temperature: 0.3
      gamma: 0.015
      retry_attempt_limit: 2
      visualize: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic,
                PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic,
                VelocityDeadbandCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # Use full footprint checks. Distance-estimating ObstaclesCritic would
      # assume a larger inflation field than the requested local 10 cm field.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        consider_footprint: true
        collision_cost: 1000000.0
        critical_cost: 300.0
        near_goal_distance: 0.5
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        deadband_velocities: [0.10, 0.0, 0.10]

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.38, 0.32], [0.38, -0.32], [-0.28, -0.32], [-0.28, 0.32]]"
      footprint_padding: 0.01
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: mid360
        mid360:
          topic: /g1/mid360/points_filtered
          sensor_frame: base_footprint
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_min_range: 0.35
          obstacle_max_range: 5.0
          raytrace_min_range: 0.35
          raytrace_max_range: 6.0
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          expected_update_rate: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Local soft obstacle costs; MPPI checks the full body separately.
        inflation_radius: 0.10
        cost_scaling_factor: 6.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.38, 0.32], [0.38, -0.32], [-0.28, -0.32], [-0.28, 0.32]]"
      footprint_padding: 0.01
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: mid360
        mid360:
          topic: /g1/mid360/points_filtered
          sensor_frame: base_footprint
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_min_range: 0.35
          obstacle_max_range: 5.0
          raytrace_min_range: 0.35
          raytrace_max_range: 6.0
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          expected_update_rate: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Global path selection retains a gradient beyond the robot footprint.
        inflation_radius: 0.55
        cost_scaling_factor: 6.0
      always_send_full_costmap: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 1.0
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.8

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /g1/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 30.0
    feedback: OPEN_LOOP
    scale_velocities: false
    # Limits match the RL policy's trained command ranges.  The MPPI
    # controller already caps its own output to 0.35 / 0.60, so these
    # wider limits only affect manual teleop.  The state_machine's
    # slew-rate limiter provides the final safety ramp.
    max_velocity: [1.0, 0.5, 1.0]
    min_velocity: [-0.5, -0.5, -1.0]
    # Proper acceleration limits (1.0 m/s²) to prevent jerk. The state_machine's
    # 3.0 m/s² slew-rate acts as a safety net, avoiding double-smoothing.
    max_accel: [1.0, 1.0, 1.0]
    max_decel: [-1.0, -1.0, -1.0]
    odom_topic: /g1/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_collision
    state_topic: /collision_monitor_state
    transform_tolerance: 0.2
    # The synthetic 360-degree cloud renders four cameras and may arrive at
    # close to 2 Hz under load. The filtered cloud is already transformed and
    # freshly stamped in base_footprint, so odometry-based shift correction is
    # unnecessary and was the source of extrapolation errors.
    source_timeout: 1.0
    base_shift_correction: false
    stop_pub_timeout: 1.0
    # Direction-aware collision prediction lets a clear reverse/sideways
    # command escape a wall without a static box blocking every direction.
    polygons: [footprint_approach]
    footprint_approach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.0
      simulation_time_step: 0.05
      max_points: 4
      visualize: true
      polygon_pub_topic: /collision_approach_footprint
      enabled: true
    observation_sources: [mid360]
    mid360:
      type: pointcloud
      topic: /g1/mid360/points_filtered
      min_height: 0.10
      max_height: 2.0
      use_global_height: false
      enabled: true
